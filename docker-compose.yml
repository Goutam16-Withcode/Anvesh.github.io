version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Edge Gateway & Reverse Proxy (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: anvesh_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
      ml:
        condition: service_started
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Next.js 14 Web Frontend
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anvesh_frontend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # NestJS API Gateway
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anvesh_backend
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=postgresql://anvesh_user:anvesh_secure_password@postgres:5432/anvesh_db?schema=public
      - JWT_SECRET=anvesh-ultra-secure-jwt-secret-key-production-ready
      - ML_SERVICE_URL=http://ml:8001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Python ML Microservice (FastAPI + LightGBM + TreeSHAP)
  # ----------------------------------------------------------------------------
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    container_name: anvesh_ml_engine
    environment:
      - PORT=8001
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Relational Source of Truth)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: anvesh_postgres
    environment:
      POSTGRES_USER: anvesh_user
      POSTGRES_PASSWORD: anvesh_secure_password
      POSTGRES_DB: anvesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anvesh_user -d anvesh_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Qdrant Vector Database (Dense 384-d Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: anvesh_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Redis 7 (Session Store & Telemetry Buffer)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: anvesh_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - anvesh_net
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # MLflow (Model Registry & Experiment Tracking)
  # ----------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: anvesh_mlflow
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlruns
    networks:
      - anvesh_net
    restart: unless-stopped

networks:
  anvesh_net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
  redis_data:
  mlflow_data:
